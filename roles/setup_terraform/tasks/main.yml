- name: Ensure directory is present
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/Documents/server"
    state: directory
    mode: '0755'

- name: Clone git repository
  ansible.builtin.git:
    repo: 'https://github.com/Nicholas-Ho/homelab-terraform.git'
    dest: "{{ ansible_user_dir }}/Documents/server/terraform"

- name: Set up Dynamic DNS
  ansible.builtin.include_tasks: setup_ddns.yml
