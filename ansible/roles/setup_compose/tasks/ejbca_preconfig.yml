- name: Set cmdline path variable
  ansible.builtin.set_fact:
    cmdline_file: "/boot/firmware/cmdline.txt"

- name: Detect cmdline file
  ansible.builtin.stat:
    path: "{{ cmdline_file }}"
  register: firmware_cmdline

- name: Ensure memory cgroup flags are present in cmdline.txt
  ansible.builtin.replace:
    path: "{{ cmdline_file }}"
    regexp: '^(?!.*\bcgroup_enable=memory\b)(.*)$'
    replace: '\1 cgroup_enable=memory cgroup_memory=1'
  when: firmware_cmdline.stat.exists
