- name: Install packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-apt
      - python3-debian

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Tailscale GPG key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/raspbian/{{ ansible_facts['distribution_release'] }}.noarmor.gpg
    dest: /etc/apt/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'
  become: true

- name: Add Tailscale apt repostiory
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: https://pkgs.tailscale.com/stable/raspbian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    architectures: "{{ target_arch }}"
    signed_by: /etc/apt/keyrings/tailscale-archive-keyring.gpg
  become: true

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    update_cache: true
  become: true
