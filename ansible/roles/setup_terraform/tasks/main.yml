- name: Ensure directory is present
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Documents/server"
    state: directory
    mode: '0755'

- name: Clone git repository
  ansible.builtin.git:
    repo: 'https://github.com/Nicholas-Ho/homelab-terraform.git'
    dest: "{{ ansible_facts['user_dir'] }}/Documents/server/terraform"
